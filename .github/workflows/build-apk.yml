name: Build Personal Finance OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PersonalFinanceOS-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source project
        run: |
          unzip -q PersonalFinanceOS-source.zip -d source
          test -f source/PersonalFinanceOS/settings.gradle.kts

      - name: Build debug APK
        working-directory: source/PersonalFinanceOS
        run: gradle --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalFinanceOS-debug-apk
          path: source/PersonalFinanceOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
